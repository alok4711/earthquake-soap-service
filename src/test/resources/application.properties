spring.application.name=earthquake-soap-service-test

# Test H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Azure Communication Services (mock/empty for tests)
azure.communication.connection-string=
azure.communication.sender-address=DoNotReply@test.com

# Scheduled Alert Polling (disabled/delayed during tests)
alert.polling.interval-ms=3600000
alert.polling.initial-delay-ms=3600000

# USGS Test Configuration
usgs.api.all-hour-url=https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson
usgs.api.all-day-url=https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson
usgs.api.connect-timeout=5000
usgs.api.read-timeout=10000
