spring.application.name=earthquake-soap-service

# Server Port: uses Azure-injected PORT environment variable if present, defaulting to 8080 locally
server.port=${PORT:8080}

# USGS Earthquake Real-Time GeoJSON API Configuration
usgs.api.all-hour-url=https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson
usgs.api.all-day-url=https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson
usgs.api.connect-timeout=5000
usgs.api.read-timeout=10000

# PostgreSQL Flexible Server / Local Persistence Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:earthquakedb}?sslmode=${DB_SSL_MODE:prefer}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Azure Communication Services Configuration
azure.communication.connection-string=${ACS_CONNECTION_STRING:}
azure.communication.sender-address=${ACS_SENDER_ADDRESS:DoNotReply@azurecomm.net}

# Scheduled Alert Polling Configuration
# Default: runs every 5 minutes (300000 ms) with initial delay of 10 seconds (10000 ms)
alert.polling.interval-ms=${ALERT_POLLING_INTERVAL_MS:300000}
alert.polling.initial-delay-ms=${ALERT_POLLING_INITIAL_DELAY_MS:10000}

# Logging Configuration
logging.level.org.springframework.ws=INFO
logging.level.com.alok.earthquake_soap_service=DEBUG
